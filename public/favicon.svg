<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Black background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>
  
  <!-- Gold outer ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#C8997E" stroke-width="1.2"/>

  <!-- CN Monogram — C -->
  <text x="14" y="38" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="26" 
    font-weight="400"
    fill="#C8997E"
    letter-spacing="-1">C</text>

  <!-- CN Monogram — N (overlapping, offset) -->
  <text x="28" y="40" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="22" 
    font-weight="700"
    fill="#C8997E">N</text>

  <!-- Steam wisps above cup -->
  <path d="M26 15 Q26.5 12 26 10" stroke="#C8997E" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M28.5 15 Q29.5 12.5 28.5 10" stroke="#C8997E" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M31 15 Q32 12 31 10" stroke="#C8997E" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- Coffee cup body -->
  <path d="M23 16 L34 16 L33 23 Q32 25 28.5 25 Q25 25 24 23 Z" fill="#C8997E" opacity="0.85"/>
  <!-- Cup handle -->
  <path d="M34 17.5 Q38 18 38 20.5 Q38 23 34 23.5" fill="none" stroke="#C8997E" stroke-width="1.2" opacity="0.85"/>
  <!-- Saucer -->
  <ellipse cx="28.5" cy="25.5" rx="6.5" ry="1.2" fill="#C8997E" opacity="0.75"/>

  <!-- Bottom text: CAFENOIR -->
  <text x="32" y="52" 
    font-family="Georgia, 'Times New Roman', serif" 
    font-size="7" 
    font-weight="400"
    fill="#C8997E"
    text-anchor="middle"
    letter-spacing="2">CAFENOIR</text>

  <!-- Thin divider line -->
  <line x1="14" y1="44" x2="50" y2="44" stroke="#C8997E" stroke-width="0.5" opacity="0.5"/>
</svg>